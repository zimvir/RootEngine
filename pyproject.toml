[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rootengine"
version = "0.1.0"
description = "Lightweight AI Agent framework with ReAct loop"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "zimvir", email = "zimvir@qq.com"}
]
keywords = ["ai", "agent", "rootengine", "react"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/zimvir/RootEngine"
Repository = "https://github.com/zimvir/RootEngine"
Documentation = "https://github.com/zimvir/RootEngine#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["rootengine*"]
exclude = ["rootengine.test*", "rootengine.utils.test*", "docs*", "example*", "cm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
